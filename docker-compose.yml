services:
  db:
    # Postgres 16 with the pgvector extension available (enabled in week 2).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: portside
      POSTGRES_PASSWORD: portside # local dev only
      POSTGRES_DB: portside
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portside"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
